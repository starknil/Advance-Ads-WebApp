<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Gift Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --primary-color: #00f5d4;
            --secondary-color: #ff2d75;
            --text-color: #e6e6e6;
            --border-color: #2a3a5e;
            --input-bg: #0f3460;
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-color);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 245, 212, 0.2);
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background-color: rgba(76, 175, 80, 0.2);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            display: block;
        }

        .message.error {
            background-color: rgba(244, 67, 54, 0.2);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            display: block;
        }

        .prize-details {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(15, 52, 96, 0.3);
            border-radius: 8px;
            display: none;
        }

        .prize-details.active {
            display: block;
        }

        .prize-details p {
            margin-bottom: 8px;
        }

        .prize-details .highlight {
            color: var(--primary-color);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-gift"></i> Claim Gift Code</h1>
            <p>Enter your gift code below to claim your prize</p>
        </div>

        <div class="message" id="responseMessage"></div>

        <div class="card">
            <form id="giftCodeForm">
                <div class="form-group">
                    <label for="gift_code"><i class="fas fa-tag"></i> Gift Code</label>
                    <input type="text" id="gift_code" name="gift_code" required placeholder="Enter your gift code (e.g. GIFT123)">
                </div>
            </form>

            <div class="prize-details" id="prizeDetails">
                <p><span class="highlight">Gift Code:</span> <span id="displayCode"></span></p>
                <p><span class="highlight">Prize:</span> <span id="displayPrize"></span></p>
                <p><span class="highlight">New Balance:</span> <span id="displayBalance"></span></p>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp initialization
        const tg = window.Telegram.WebApp;
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            tg.HapticFeedback.impactOccurred("medium");
            window.location.href = 'index.html';
        });
        
        // Expand the WebApp to full view
        tg.expand();
        
        // Get user ID from Telegram
        const userId = tg.initDataUnsafe.user?.id || 0;
        
        // Form elements
        const giftCodeForm = document.getElementById('giftCodeForm');
        const responseMessage = document.getElementById('responseMessage');
        const prizeDetails = document.getElementById('prizeDetails');
        
        // Initialize Telegram Main Button
        tg.MainButton.setText('CLAIM GIFT');
        tg.MainButton.onClick(() => {
            submitClaim();
        });
        tg.MainButton.show();
        tg.MainButton.disable();
        
        // Update main button state when form changes
        document.getElementById('gift_code').addEventListener('input', () => {
            if (document.getElementById('gift_code').value.trim() !== '') {
                tg.MainButton.enable();
            } else {
                tg.MainButton.disable();
            }
        });
        
        async function submitClaim() {
            tg.MainButton.showProgress();
            
            // Get form data
            const formData = {
                user_id: userId,
                gift_code: document.getElementById('gift_code').value.trim(),
                init_data: window.Telegram.WebApp.initData
            };
            
            try {
                const response = await fetch('https://wenepay.cyou/scratch/api/claim-gift.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                // Show response message
                responseMessage.textContent = result.message;
                responseMessage.className = 'message ' + (result.ok ? 'success' : 'error');
                
                if (result.ok) {
                    // Display prize details
                    document.getElementById('displayCode').textContent = result.result.gift_code;
                    document.getElementById('displayPrize').textContent = result.result.prize;
                    document.getElementById('displayBalance').textContent = result.result.new_balance;
                    prizeDetails.classList.add('active');
                    
                    // Clear form and disable button
                    document.getElementById('gift_code').value = '';
                    tg.MainButton.disable();
                } else {
                    prizeDetails.classList.remove('active');
                }
            } catch (error) {
                responseMessage.textContent = 'Network error. Please try again.';
                responseMessage.className = 'message error';
                console.error('Error:', error);
            } finally {
                tg.MainButton.hideProgress();
                
                // Scroll to message
                responseMessage.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
