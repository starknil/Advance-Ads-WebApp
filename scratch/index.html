<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scale=none">
    <title>Scratch Rewards Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://ad.gigapub.tech/script?id=1390"></script>
    <script src="https://ad.gigapub.tech/script?id=1099"></script>
    <script src="https://js.mbidadm.com/in-stream-ad-admanager/tma.js"></script>
    <script src="https://clients.tgbro.link/shop/api/nav-footer.js"></script>
    <script src="popup.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='9635675' data-sdk='show_9635675'></script>
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --primary-color: #7c3aed;
            --primary-light: rgba(124, 58, 237, 0.1);
            --secondary-color: #4e2c94;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --success-color: #10b981;
            --error-color: #ef4444;
            --card-bg: rgba(124, 58, 237, 0.05);
            --task-bg: rgba(30, 30, 30, 0.8);
            --button-color: #7c3aed;
            --button-hover: #6b21a8;
            --silver-color: #c0c0c0;
            --gold-color: #ffd700;
            --diamond-color: #b9f2ff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            font-family: 'Ubuntu', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            padding-top: 1px;
            min-height: 100vh;
            display: flex;
            user-select: none;
            flex-direction: column;
            position: relative;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            25% { transform: scale(1.05); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding-top: 50px;
            padding-bottom: 20px;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            margin-right: 8px;
        }
        .verified-icon {
            width: 20px;
            height: 20px;
        }
        .giveaway-btn {
            background: var(--button-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            margin-bottom: 5px;
        }
        .giveaway-btn:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }
        .app-content {
            padding: 24px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 60px;
        }
        .user-info-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }
        .user-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
        }
        .balance-value {
            color: var(--success-color);
        }
        .card-count-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-icon {
            margin-right: 6px;
            color: var(--primary-color);
        }
        .watch-ads-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }
        .watch-ads-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .ads-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .ads-stat-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
        }
        .ads-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .watch-ads-button {
            width: 100%;
            padding: 12px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .watch-ads-button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .watch-ads-button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .tasks-section {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            padding-bottom: 10px;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(124, 58, 237, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(124, 58, 237, 0.1);
            cursor: pointer;
        }
        .task-item:hover {
            background: rgba(124, 58, 237, 0.1);
            transform: translateY(-2px);
        }
        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .task-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            overflow: hidden;
        }
        .task-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .task-details {
            display: flex;
            flex-direction: column;
        }
        .task-name {
            font-weight: 500;
            font-size: 14px;
        }
        .task-description {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .task-reward {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .reward-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            pointer-events: none;
        }
        .reward-silver {
            background: var(--silver-color);
            color: #333;
        }
        .reward-gold {
            background: var(--gold-color);
            color: #333;
        }
        .reward-diamond {
            background: var(--diamond-color);
            color: #333;
        }
        .task-action {
            min-width: 80px;
            padding: 8px 16px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .task-action:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .task-action:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .task-progress {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        .progress-bar {
            width: 60px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
        }
        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
        }
        .video-overlay.active {
            visibility: visible;
        }
        .video-player {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
        }
        .close-video-btn {
            display: none;
            margin-top: 10px;
            padding: 10px 20px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .close-video-btn:hover {
            background: var(--button-hover);
        }
        .close-video-btn.active {
            display: block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .no-tasks {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .no-tasks-lottie {
            width: 300px;
            height: 300px;
        }
        lottie-player {
            background: transparent !important;
        }
        @media (max-width: 480px) {
            .app-content {
                padding: 16px;
                padding-top: calc(50px + env(safe-area-inset-top));
            }
            .user-stats {
                gap: 8px;
            }
            .stat-value {
                font-size: 18px;
            }
            .no-tasks-lottie {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1 class="header-title">SHIBAdEarner</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Twitter_Verified_Badge.svg" alt="Verified" class="verified-icon" id="verified-icon">
        </div>
    </header>
    <div class="app-content">
        <div class="video-overlay" id="video-overlay">
            <video class="video-player" id="video-player" controlsList="nodownload nofullscreen" disablePictureInPicture>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <button class="close-video-btn" id="close-video-btn">Close</button>
        </div>
        <!-- Giveaway Button Above Balance Section -->
        <div style="display: flex; justify-content: flex-end;">
            <button class="giveaway-btn" id="giveawayBtn">
                <i class="fas fa-gift"></i> Giveway
            </button>
        </div>
        <div class="user-info-card">
            <div class="user-stats">
                <div class="stat-item">
                    <div class="stat-label">ID</div>
                    <div class="stat-value" id="user-id">—</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">BALANCE</div>
                    <div class="stat-value balance-value">
                        <span id="user-balance">—</span> <span id="currency">SHIB</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">CARDS</div>
                    <div class="stat-value card-count-container">
                        <i class="fas fa-ticket-alt card-icon"></i>
                        <span id="card-count">—</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="watch-ads-section" id="watch-ads-section">
            <h2 class="section-title">Watch Ads & Earn</h2>
            <div class="watch-ads-stats">
                <div class="ads-stat-item">
                    <div class="ads-stat-value" id="ads-watched-total">—</div>
                    <div class="ads-stat-label">Total Watched</div>
                </div>
                <div class="ads-stat-item">
                    <div class="ads-stat-value" id="ads-left-This hour">—</div>
                    <div class="ads-stat-label">Left This hour</div>
                </div>
                <div class="ads-stat-item">
                    <div class="ads-stat-value" id="ads-reward">—</div>
                    <div class="ads-stat-label">Reward/Ad</div>
                </div>
            </div>
            <button class="watch-ads-button" id="watch-ads-button" disabled>
                <i class="fas fa-ad"></i> Watch Ad Now
            </button>
        </div>
        <div class="tasks-section" id="tasks-section">
            <h2 class="section-title">Available Tasks</h2>
            <div class="task-list" id="task-list">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading tasks...</p>
                </div>
            </div>
        </div>
    </div>
    <script>
    const tg = window.Telegram.WebApp;
    tg.backgroundColor = '#121212';
    tg.headerColor = '#121212';
    tg.BackButton.hide();
    tg.requestFullscreen();
    tg.enableClosingConfirmation();
    tg.disableVerticalSwipes();
    let currentUserId = null;
    let currentInitData = null;
    const close_timer = 15; // Seconds after which close button appears
    // Ad provider configuration (set to true to enable, false to disable)

    const adsMinimumTime = 10; // Minimum time in seconds to watch the ad

    const adProviders = {
        giga1099: false,
        giga1390: false,
        mybid: false,
        monetag: false,
        adexium: true
    };

    let adexiumWidget;

    if (adProviders.adexium){
        adexiumWidget = new AdexiumWidget({
            wid: 'e8531f16-1667-45d7-b801-5d2b232640bc',
            adFormat: 'interstitial',
            debug: false
        });
    }
    // Cookie helper functions
    function setCookie(name, value, days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "; expires=" + date.toUTCString();
        document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict";
    }
    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }
    function isVideoWatchedToday() {
        const lastWatched = getCookie('video_ad_watched');
        if (!lastWatched) return false;
        const today = new Date().toISOString().split('T')[0];
        return lastWatched === today;
    }
    document.addEventListener('DOMContentLoaded', function() {
        const user = tg.initDataUnsafe.user || {};
        currentUserId = user.id || 0;
        currentInitData = tg.initData;
        document.getElementById('verified-icon').src = 'https://upload.wikimedia.org/wikipedia/commons/e/e4/Twitter_Verified_Badge.svg';
        // Initialize Mybid ad provider if enabled
        if (adProviders.mybid) {
            window.initCdTma?.({ id: '2009991' })
                .then(show => {
                    window.showMybid = show;
                    console.log('Mybid initialized successfully');
                })
                .catch(e => {
                    console.error('Mybid Ad initialization failed:', e);
                });
        }
        // Add event listener for the giveaway button
        document.getElementById('giveawayBtn').addEventListener('click', function() {
            giveawayNotice.show({
                action: function() {
                    redirect('participate.html');
                }
            });
        });
        // Add event listener for video close button
        const closeVideoBtn = document.getElementById('close-video-btn');
        closeVideoBtn.addEventListener('click', function() {
            const videoPlayer = document.getElementById('video-player');
            const videoOverlay = document.getElementById('video-overlay');
            videoPlayer.pause();
            videoOverlay.classList.remove('active');
            fetchAdsData(); // Refresh ads data after closing video
        });
        fetchDashboard();
        fetchAdsData();
        document.getElementById('watch-ads-button').addEventListener('click', watchAd);
    });
    async function fetchDashboard() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';
        try {
            const response = await fetch('api/dashboard.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: currentUserId,
                    init_data: currentInitData
                })
            });
            const data = await response.json();
            if (data.ok) {
                document.getElementById('user-id').textContent = data.user_details.user_id || '—';
                document.getElementById('user-balance').textContent = data.user_details.balance || '0.00';
                document.getElementById('currency').textContent = data.currency || 'SHIB';
                const cardCount = data.scratch_card ? data.scratch_card.length : 0;
                document.getElementById('card-count').textContent = cardCount;
                renderTasks(data.tasks || []);
            } else {
                if (data.message === 'User not found') {
                    window.location.href = 'register.html';
                } else {
                    showError('Error', data.message || 'Failed to load dashboard.');
                }
            }
        } catch (error) {
            console.error('Error fetching dashboard:', error);
            showError('Connection Error', 'Failed to connect to the server. Please try again.');
        } finally {
            loading.style.display = 'none';
        }
    }
    async function fetchAdsData() {
        try {
            const response = await fetch('api/watch-ad.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: currentUserId,
                    action: "details"
                })
            });
            const data = await response.json();
            if (data.status === "success") {
                document.getElementById('ads-watched-total').textContent = data.total_ads_watched || 0;
                document.getElementById('ads-left-This hour').textContent = data.ads_left_this_hour || 0;
                document.getElementById('ads-reward').textContent = data.reward_per_ads || '0.00';
                const adsButton = document.getElementById('watch-ads-button');
                if (data.ads_left_this_hour > 0) {
                    adsButton.disabled = false;
                    adsButton.textContent = isVideoWatchedToday() ? 'Watch Ad Now' : 'Watch Video Ad';
                } else {
                    adsButton.disabled = true;
                    adsButton.textContent = "No ads left This hour";
                }
            } else {
                showError('Ads Error', data.message || 'Failed to load ads data.');
            }
        } catch (error) {
            console.error('Error fetching ads data:', error);
            showError('Connection Error', 'Failed to load ads data. Please try again.');
        }
    }

    async function watchAd() {
        const button = document.getElementById('watch-ads-button');
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading Ad...';

        try {
            // Check if today's video ad has been watched
            
            if (!isVideoWatchedToday()) {
                const videoOverlay = document.getElementById('video-overlay');
                const videoPlayer = document.getElementById('video-player');
                const closeVideoBtn = document.getElementById('close-video-btn');
                // Show video overlay
                videoOverlay.classList.add('active');
                videoPlayer.play();
                // Show close button after close_timer seconds
                setTimeout(() => {
                    closeVideoBtn.classList.add('active');
                }, close_timer * 1000);
                // Mark video as watched only when it ends
                videoPlayer.onended = async () => {
                    const today = new Date().toISOString().split('T')[0];
                    setCookie('video_ad_watched', today, 1); // Set cookie for 1 day
                    videoOverlay.classList.remove('active');
                    closeVideoBtn.classList.remove('active');
                    // Record ad watch
                    const response = await fetch('api/watch-ad.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_id: currentUserId
                        })
                    });
                    const data = await response.json();
                    if (data.status === "success") {
                        document.getElementById('user-balance').textContent = data.new_balance || '0.00';
                        Swal.fire({
                            icon: 'success',
                            title: 'Video Ad Watched!',
                            text: `You earned ${data.earned || '0.00'} SHIB for watching the video.`,
                            confirmButtonColor: 'var(--primary-color)',
                            background: 'var(--bg-color)',
                            color: 'var(--text-color)'
                        });
                    } else {
                        showError('Ad Error', data.message || 'Failed to record video ad watch.');
                    }
                    fetchAdsData();
                    button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                    button.disabled = false;
                };
                // Handle video errors
                videoPlayer.onerror = () => {
                    videoOverlay.classList.remove('active');
                    closeVideoBtn.classList.remove('active');
                    showError('Video Error', 'Failed to play video ad. Please try again.');
                    fetchAdsData();
                    button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                    button.disabled = false;
                };
            } else {
                // Get enabled ad providers

                const enabledProviders = Object.keys(adProviders).filter(provider => adProviders[provider]);

                if (enabledProviders.length === 0) {
                    showError('Ad Error', 'No ad providers are enabled. Please enable at least one ad provider.');
                    fetchAdsData();
                    button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                    button.disabled = false;
                    return;
                }

                // Randomly select from enabled providers
                const selectedProvider = enabledProviders[Math.floor(Math.random() * enabledProviders.length)];
                let adShown = false;
                let adsStartTime = 0;

                try {

                    adsStartTime = Date.now();

                    if (selectedProvider === 'giga1099' && window.showGiga) {
                        window.gigaAdId = '1099'; // Set ad ID for Giga 1099
                        await window.showGiga();
                        adShown = true;
                    } else if (selectedProvider === 'giga1390' && window.showGiga) {
                        window.gigaAdId = '1390'; // Set ad ID for Giga 1390
                        await window.showGiga();
                        adShown = true;
                    } else if (selectedProvider === 'mybid' && window.showMybid) {
                        await window.showMybid();
                        adShown = true;
                    } else if (selectedProvider === 'monetag') {
                        await show_9635675().then(() => {
                            adShown = true;
                        }).catch(e => {
                            console.error('Monetag ad error:', e);
                            throw new Error('Monetag ad failed');
                        });
                    } else if (selectedProvider === 'adexium' && adexiumWidget != undefined) {

                        adexiumWidget.requestAd('interstitial');

                        await new Promise((resolve, reject) => {
                            adexiumWidget.on('adReceived', async (ad) => {
                                adexiumWidget.displayAd(ad);
                            });
                            adexiumWidget.on('noAdFound', async () => {
                                //showError('No AD Found', 'No Ad was found. Please try again.');
                                window.gigaAdId = '1099'; // Set ad ID for Giga 1099
                                await window.showGiga();
                                adShown = true;
                                resolve(false);
                            })
                            adexiumWidget.on('adClosed', () => {
                                adShown = true;
                                resolve(true);
                            });
                        });

                    } else {
                        throw new Error(`${selectedProvider} not initialized`);
                    }

                } catch (error) {
                    console.error(`Error showing ${selectedProvider} ad:`, error);
                    showError('Ad Error', `Failed to show ${selectedProvider} ad. Please try again.`);
                    fetchAdsData();
                    button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                    button.disabled = false;
                    return;
                }

                const watchedTime = Math.round((Date.now() - adsStartTime) / 1000);


                if (adShown) {

                if (watchedTime < adsMinimumTime) {
                    const remainingTime = adsMinimumTime - watchedTime;
                    Swal.fire({
                        icon: 'info',
                        title: 'Ad Incomplete',
                        text: `😰 Sorry, Ads seconds was too low. Minimum required is ${adsMinimumTime} seconds!`,
                        confirmButtonColor: 'var(--primary-color)',
                        background: 'var(--bg-color)',
                        color: 'var(--text-color)'
                    });
                    button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                    button.disabled = false;
                    return;
                }

                    const response = await fetch('api/watch-ad.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            ad_provider: selectedProvider
                        })
                    });
                    const data = await response.json();
                    if (data.status === "success") {
                        document.getElementById('user-balance').textContent = data.new_balance || '0.00';
                        Swal.fire({
                            icon: 'success',
                            title: 'Ad Watched!',
                            text: `You earned ${data.earned || '0.00'} SHIB for watching the ad.`,
                            confirmButtonColor: 'var(--primary-color)',
                            background: 'var(--bg-color)',
                            color: 'var(--text-color)'
                        });
                    } else {
                        showError('Ad Error', data.message || 'Failed to record ad watch.');
                    }
                }
                fetchAdsData();
                button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
                button.disabled = false;
            }
        } catch (error) {
            console.error('Error watching ad:', error);
            //alert(error)
            showError('Ad Error', 'Failed to show ad. Please try again.');
            fetchAdsData();
            button.innerHTML = '<i class="fas fa-ad"></i> Watch Ad Now';
            button.disabled = false;
        }
    }
    
    
    function renderTasks(tasks) {
        const tasksSection = document.getElementById('tasks-section');
        tasksSection.innerHTML = '';
        if (!tasks || tasks.length === 0) {
            tasksSection.innerHTML = `
                <div class="no-tasks">
                    <div class="no-tasks-lottie">
                        <lottie-player
                            src="no-task.json"
                            background="transparent"
                            speed="1"
                            style="width: 100%; height: 100%;"
                            loop
                            autoplay
                        ></lottie-player>
                    </div>
                    <p>You have completed all the tasks, new tasks will be added soon</p>
                </div>
            `;
            return;
        }
        tasksSection.innerHTML = `
            <h2 class="section-title">Available Tasks</h2>
            <div class="task-list" id="task-list"></div>
        `;
        const taskList = document.getElementById('task-list');
        tasks.forEach(task => {
            const taskElement = document.createElement('div');
            taskElement.className = 'task-item';
            const progressPercent = task.limit > 0 ? (task.completed / task.limit) * 100 : 100;
            const progressText = task.limit > 0 ? `${task.completed}/${task.limit}` : `${task.completed}/∞`;
            const buttonHtml = `<button class="task-action" id="task-button-${task.task_id}" disabled>Claim</button>`;
            taskElement.innerHTML = `
                <div class="task-content">
                    <div class="task-icon">
                        <img src="${task.icon || '/api/placeholder/36/36'}" onerror="this.src='/api/placeholder/36/36'" alt="Task Icon">
                    </div>
                    <div class="task-details">
                        <div class="task-name">${task.name}</div>
                        <div class="task-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                            <span>${progressText}</span>
                        </div>
                    </div>
                </div>
                <div class="task-reward">
                    ${getRewardIcon(task.reward)}
                    ${buttonHtml}
                </div>
            `;
            taskList.appendChild(taskElement);
            taskElement.addEventListener('click', (e) => {
                if (e.target.classList.contains('task-action')) {
                    e.stopPropagation();
                    claimTask(task.task_id);
                } else {
                    visitTask(task.task_id, task.url);
                }
            });
            const button = document.getElementById(`task-button-${task.task_id}`);
            if (button) {
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    claimTask(task.task_id);
                });
            }
        });
    }
    function getRewardIcon(reward) {
        const rewardType = reward ? reward.toLowerCase() : 'silver';
        const iconClass = getIconClass(rewardType);
        return `<div class="reward-icon reward-${rewardType}">
            <i class="${iconClass}"></i>
        </div>`;
    }
    function getIconClass(rewardType) {
        switch(rewardType) {
            case 'silver': return 'fas fa-medal';
            case 'gold': return 'fas fa-trophy';
            case 'diamond': return 'fas fa-gem';
            default: return 'fas fa-medal';
        }
    }
    function visitTask(taskId, url) {
        window.open(url, '_blank');
        const button = document.getElementById(`task-button-${taskId}`);
        if (button) {
            setTimeout(() => {
                button.disabled = false;
            }, 3000);
        }
    }
    async function claimTask(taskId) {
        const button = document.getElementById(`task-button-${taskId}`);
        if (!button) return;
        button.disabled = true;
        button.textContent = 'Claiming...';
        try {
            const response = await fetch('api/claim.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: currentUserId,
                    task_id: taskId,
                    init_data: currentInitData
                })
            });
            const data = await response.json();
            if (data.ok) {
                showSuccess('Success!', 'Task reward claimed successfully!', () => {
                    location.reload();
                });
            } else {
                showError('Claim Failed', data.message || 'Failed to claim reward.');
                button.disabled = false;
                button.textContent = 'Claim';
            }
        } catch (error) {
            console.error('Error claiming task:', error);
            showError('Connection Error', 'Failed to connect to the server. Please try again.');
            fetchDashboard();
        }
    }
    function showSuccess(title, text, callback) {
        Swal.fire({
            icon: 'success',
            title: title,
            text: text,
            confirmButtonColor: 'var(--primary-color)',
            background: 'var(--bg-color)',
            color: 'var(--text-color)'
        }).then(() => {
            if (callback) callback();
        });
    }
    function showError(title, text) {
        Swal.fire({
            icon: 'error',
            title: title,
            text: text,
            confirmButtonColor: 'var(--primary-color)',
            background: 'var(--bg-color)',
            color: 'var(--text-color)'
        });
    }
    function redirect(url, vibrate) {
        if (vibrate && navigator.vibrate) navigator.vibrate(7);
        window.location.href = url;
    }
    navFooter.add(
        {
            theme: 'dark',
            selectedColor: '#7c3aed'
        },
        [
            {
                name: "TASK",
                icon: "fa-tasks",
                selected: true,
                onClick: (e) => redirect("index.html", true)
            },
            {
                name: "CARDS",
                icon: "fa-credit-card",
                onClick: (e) => redirect("cards.html", true)
            },
            {
                name: "INVITE",
                icon: "fa-user-plus",
                onClick: (e) => redirect("refers.html", true)
            },
            {
                name: "WITHDRAW",
                icon: "fa-money-bill",
                onClick: (e) => redirect("withdraw.html", true)
            },
            {
                name: "MY TASK",
                icon: "fa-server",
                onClick: (e) => redirect("mytask.html", true)
            }
        ]
    );
</script>
